services:
  - type: web
    name: luigi-diary-webapp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disks:
      - name: luigi-diary-data
        mountPath: /data
        sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_FILE
        value: /data/events.json
